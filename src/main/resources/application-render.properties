spring.application.name=BillBuddy

# Render supplies PORT. 10000 is a fallback for local testing with the render profile.
server.port=${PORT}

# PostgreSQL connection supplied through Render environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep production schema changes explicit: create or migrate the schema before startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT_SECRET must be at least 32 bytes long.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Set this to the exact Vercel origin, such as https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Configure a reachable Ollama host if AI explanations should work in production.
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2:3b}

logging.level.root=INFO
logging.level.com.example.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO